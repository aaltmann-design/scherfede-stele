<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zukunftswerkstatt Scherfede e. V. – Stele Kopfzeile</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial,Helvetica,sans-serif; }
  /* 60px innen: Galaxy Signage skaliert diese Vorlage bei 1080x120 mit Auto Scaling. */
  .kopf { position:relative; width:100%; height:60px; background:#000; overflow:hidden; }
  .links,.rechts { position:absolute; top:0; height:60px; min-width:0; }
  .links { left:10px; right:51%; }
  .rechts { left:49%; right:10px; text-align:right; }
  .name,.datum,.adresse,.wetter { position:absolute; left:0; right:0; white-space:nowrap; overflow:visible; }
  .name,.datum { top:0; font-weight:700; line-height:34px; }
  .adresse,.wetter { top:34px; line-height:25px; color:#f0f7f2; }
  .name { font-size:34px; }
  .datum { font-size:31px; }
  .adresse { font-size:26px; }
  .wetter { font-size:25px; }
  /* Keine Media-Query und keine automatische Schriftverkleinerung. */
</style>
</head>
<body>
<header class="kopf" aria-label="Stele Kopfzeile">
  <section class="links">
    <div class="name">Zukunftswerkstatt Scherfede e. V.</div>
    <div class="adresse">Dorftreff · Briloner Straße 30</div>
  </section>
  <section class="rechts">
    <div class="datum" id="datetime">Datum und Uhrzeit werden geladen …</div>
    <div class="wetter" id="weather">Wetter Scherfede wird geladen …</div>
  </section>
</header>
<script>
'use strict';
const dateEl = document.getElementById('datetime');
const weatherEl = document.getElementById('weather');
function updateDate() {
  const now = new Date();
  const date = new Intl.DateTimeFormat('de-DE', { timeZone:'Europe/Berlin', weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(now);
  const time = new Intl.DateTimeFormat('de-DE', { timeZone:'Europe/Berlin', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(now);
  dateEl.textContent = date + ' · ' + time + ' Uhr';
}
updateDate();
setInterval(updateDate,15000);
function symbol(code) {
  if (code === 0) return '☀️';
  if (code <= 3) return '⛅';
  if (code === 45 || code === 48) return '🌫️';
  if (code >= 51 && code <= 67) return '🌧️';
  if (code >= 71 && code <= 77) return '❄️';
  if (code >= 80 && code <= 82) return '🌦️';
  if (code >= 95) return '⛈️';
  return '🌤️';
}
async function updateWeather() {
  try {
    const url='https://api.open-meteo.com/v1/forecast?latitude=51.53&longitude=9.03&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FBerlin&forecast_days=2';
    const resp=await fetch(url,{cache:'no-store'});
    if(!resp.ok) throw new Error('Wetterdienst nicht erreichbar');
    const data=await resp.json();
    const current=Math.round(data.current.temperature_2m);
    const todayHi=Math.round(data.daily.temperature_2m_max[0]);
    const tomorrowHi=Math.round(data.daily.temperature_2m_max[1]);
    const tomorrowLo=Math.round(data.daily.temperature_2m_min[1]);
    weatherEl.textContent=`${symbol(data.current.weather_code)} Jetzt ${current}° · Heute ${todayHi}° · Morgen ${symbol(data.daily.weather_code[1])} ${tomorrowLo}–${tomorrowHi}°C`;
  } catch(err) { weatherEl.textContent='Wetterdaten momentan nicht verfügbar'; }
}
updateWeather();
setInterval(updateWeather,15*60*1000);
</script>
</body>
</html>
