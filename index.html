<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zukunftswerkstatt Scherfede e. V. – Stele Kopfzeile</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
/* Die kompakte interne Hoehe ist fuer Galaxy Signage mit Auto Scaling vorgesehen. */
header{height:60px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;padding:2px 12px;gap:12px;background:#000;overflow:hidden}
.left,.right{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:1px}
.right{align-items:flex-end;text-align:right}
.name,.addr,.datetime,.weather{white-space:nowrap;line-height:1.06;max-width:100%}
/* 50 Prozent groesser als die bisherige GitHub-Fassung (23/18/20/18). */
.name{font-weight:700;font-size:34.5px}
.addr{font-size:27px;color:#f0f7f2}
.datetime{font-weight:700;font-size:30px}
.weather{font-size:27px;color:#f0f7f2}
</style>
</head>
<body>
<header aria-label="Stele Kopfzeile">
<section class="left"><div class="name">Zukunftswerkstatt Scherfede e. V.</div><div class="addr">Dorftreff · Briloner Straße 30</div></section>
<section class="right"><div class="datetime" id="datetime">Datum und Uhrzeit werden geladen …</div><div class="weather" id="weather">Wetter Scherfede wird geladen …</div></section>
</header>
<script>
'use strict';
const dateEl=document.getElementById('datetime');
const weatherEl=document.getElementById('weather');
const originals={name:34.5,addr:27,datetime:30,weather:27};
function fitText(){
  const root=document.querySelector('header');
  const pairs=[['name',document.querySelector('.name')],['addr',document.querySelector('.addr')],['datetime',dateEl],['weather',weatherEl]];
  for(const [key,el] of pairs)el.style.fontSize=originals[key]+'px';
  // Wahrung der Lesbarkeit: bei Platzmangel werden beide Zeilen je Spalte zusammen angepasst.
  for(const selector of ['.left','.right']){
    const col=document.querySelector(selector);
    const elements=[...col.children];
    const availableH=Math.max(1,root.clientHeight-4);
    const widthFactors=elements.map(el=>el.clientWidth/Math.max(1,el.scrollWidth));
    const heightFactor=availableH/Math.max(1,col.scrollHeight);
    const scale=Math.min(1,heightFactor,...widthFactors);
    for(const el of elements)el.style.fontSize=(parseFloat(getComputedStyle(el).fontSize)*scale).toFixed(2)+'px';
  }
}
function updateDate(){
 const now=new Date();
 const date=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);
 const time=new Intl.DateTimeFormat('de-DE',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);
 dateEl.textContent=date+' · '+time+' Uhr'; fitText();
}
function symbol(code){if(code===0)return '☀️';if(code<=3)return '⛅';if(code===45||code===48)return '🌫️';if(code>=51&&code<=67)return '🌧️';if(code>=71&&code<=77)return '❄️';if(code>=80&&code<=82)return '🌦️';if(code>=95)return '⛈️';return '🌤️';}
async function updateWeather(){
 try{
 const url='https://api.open-meteo.com/v1/forecast?latitude=51.53&longitude=9.03&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Europe%2FBerlin&forecast_days=2';
 const resp=await fetch(url,{cache:'no-store'});if(!resp.ok)throw new Error('Wetterdienst nicht erreichbar');
 const data=await resp.json();
 const current=Math.round(data.current.temperature_2m);
 const todayHi=Math.round(data.daily.temperature_2m_max[0]);
 const tomorrowHi=Math.round(data.daily.temperature_2m_max[1]);
 const tomorrowLo=Math.round(data.daily.temperature_2m_min[1]);
 weatherEl.textContent=`${symbol(data.current.weather_code)} Jetzt ${current} °C · Heute ${todayHi} °C · Morgen ${symbol(data.daily.weather_code[1])} ${tomorrowLo}–${tomorrowHi} °C`;
 }catch(e){weatherEl.textContent='Wetterdaten momentan nicht verfügbar';}
 fitText();
}
window.addEventListener('resize',fitText);
updateDate();setInterval(updateDate,15000);
updateWeather();setInterval(updateWeather,15*60*1000);
</script>
</body>
</html>
